name: Build and Release GameCoreParker

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*" # Triggers release logic when you push a tag like v1.0.1
  pull_request:
    branches: [ "main" ]

# This is required to allow the action to create a Release and upload files
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: GameCoreParker.sln
      Project_Path: GameCoreParker/GameCoreParker.csproj # Update to your actual .csproj path

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Publish Singular EXE
      run: |
        dotnet publish ${{ env.Project_Path }} `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishAot=true `
          -o ./publish

    # Optional: Rename the file to include the version if it's a tag
    - name: Rename Output
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        Move-Item ./publish/*.exe ./publish/GameCoreParker-${{ github.ref_name }}.exe

    # 1. Upload as a standard Artifact (Always happens)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameCoreParker-Windows-x64
        path: ./publish/*.exe

    # 2. Upload to GitHub Releases (Only happens on tags v*)
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/*.exe
        generate_release_notes: true
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
