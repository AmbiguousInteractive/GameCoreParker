name: Build and Release GameCoreParker

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*" 
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # IMPORTANT: Ensure this path correctly points to your .csproj file
      Project_Path: GameCoreParker/GameCoreParker.csproj 

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Publish Singular EXE
      run: |
        dotnet publish ${{ env.Project_Path }} `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishAot=true `
          -o ./publish_output

    # This step helps us see exactly what was created in the logs
    - name: List Files (Debug)
      run: dir ./publish_output

    # Renames the EXE so the release isn't generic
    - name: Prepare Artifact
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $exe = Get-ChildItem "./publish_output/*.exe" | Select-Object -First 1
        $newName = "GameCoreParker-${{ github.ref_name }}.exe"
        Rename-Item -Path $exe.FullName -NewName $newName
        # Move it to a clean folder for uploading
        New-Item -ItemType Directory -Force -Path ./release_zip
        Move-Item "./publish_output/$newName" ./release_zip/

    - name: Upload Build Artifact (Internal)
      uses: actions/upload-artifact@v4
      with:
        name: GameCoreParker-Binary
        path: ./publish_output/*.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        # We point directly to the folder containing the renamed EXE
        files: ./release_zip/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
