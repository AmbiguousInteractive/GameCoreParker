name: Build and Release GameCoreParker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      Project_Path: GameCoreParker/GameCoreParker.csproj 

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Publish Singular EXE
      run: |
        dotnet publish ${{ env.Project_Path }} `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishAot=true `
          -o ./publish_output

    - name: List Files (Debug)
      run: dir ./publish_output

    - name: Prepare Artifact
      shell: pwsh
      run: |
        $exe = Get-ChildItem "./publish_output/*.exe" | Select-Object -First 1
        # Use 'latest' as the name if not a tag
        $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "latest" }
        $newName = "GameCoreParker-$version.exe"
        
        New-Item -ItemType Directory -Force -Path ./release_zip
        Copy-Item $exe.FullName "./release_zip/$newName"
        Write-Host "Prepared artifact: $newName"

    # 1. Internal Artifact (Always available in the 'Actions' tab)
    - name: Upload Build Artifact (Internal)
      uses: actions/upload-artifact@v4
      with:
        name: GameCoreParker-Win64
        path: ./release_zip/*.exe

    # 2. GitHub Release (Always happens on main branch push)
    - name: Update Release
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        # If it's a branch push, use the 'latest' tag. If it's a tag, use that tag name.
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        files: ./release_zip/*.exe
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Continuous Build' }}
        body: "Automated build from the latest commit on main."
        generate_release_notes: true
        allowUpdates: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
